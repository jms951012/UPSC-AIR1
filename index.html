<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>UPSC Active Recall Engine</title></head><body><header><div><h1>UPSC Active Recall Engine</h1><p>MCQs • Active Recall • Spaced Revision</p></div></header><main>
<section id="home" class="screen"><div class="card"><h2>Your UPSC Question Bank</h2><p class="muted">Subject → Chapter → Topic → MCQ</p><input id="search" placeholder="Search subject, chapter, topic or question…"><div id="subjectTree"></div><label class="import">＋ Import Question Bank (.json)<input id="fileInput" type="file" accept=".json" hidden></label><button id="backupBtn" class="secondary">💾 Export Complete Backup</button><button id="restoreBtn" class="secondary">↥ Restore Complete Backup</button></div>
<div class="grid"><button data-action="due">🧠 Due Review<br><small id="dueCount"></small></button><button data-action="wrong">🔴 Wrong<br><small id="wrongCount"></small></button><button data-action="marked">⭐ Bookmarks<br><small id="markCount"></small></button><button data-action="history">📊 Performance<br><small id="testCount"></small></button></div><div class="card"><h3>Quick Test</h3><button data-action="all">🎯 All Questions</button></div></section>
<section id="chapter" class="screen hidden"><div class="card"><button id="back" class="secondary">← Subjects</button><h2 id="chapterTitle"></h2><p id="chapterSub" class="muted"></p><div id="topics"></div><button id="chapterTest">🎯 Test Entire Chapter</button><button id="deleteChapter" class="danger">🗑 Delete This Chapter / Question Bank</button></div></section>
<section id="setup" class="screen hidden"><div class="card"><h2 id="setupTitle"></h2><p id="setupSub" class="muted"></p><label>Selection<select id="selection"><option value="random">Random</option><option value="sequential">Sequential</option><option value="weak">Weak topics first</option></select></label><label>Difficulty<select id="difficulty"><option value="all">All</option><option>Easy</option><option>Moderate</option><option>Hard</option><option>UPSC</option></select></label><label>Timer<select id="timer"><option value="0">No timer</option><option value="10">10 minutes</option><option value="30">30 minutes</option><option value="60">60 minutes</option></select></label><label><input id="instant" type="checkbox" checked> Show explanation immediately</label><button id="start">Start Active Recall Test</button><button class="secondary" id="cancel">Cancel</button></div></section>
<section id="quiz" class="screen hidden"><div class="top"><span id="progress"></span><span id="score"></span><span id="clock"></span></div><div class="card"><div id="meta" class="muted"></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hidden"></div><button id="bookmark" class="secondary">☆ Bookmark</button><button id="next" class="hidden">Next →</button></div></section>
<section id="result" class="screen hidden"><div class="card"><h2>Test Complete</h2><div id="resultStats"></div><h3>Weak Topics</h3><ul id="weak"></ul><button id="retry">🔴 Practice Wrong Questions</button><button class="secondary" id="resultHome">Back to Home</button></div></section>
<section id="history" class="screen hidden"><div class="card"><h2>Performance Dashboard</h2><div id="performance"></div><button class="secondary" id="historyHome">Back to Home</button></div></section>
</main><script src="app.js?v=34"></script></body></html>
